<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>【試験】Lazurite 清掃スケジュール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+Thai:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<link rel="stylesheet" href="css/cleaning.css?v=202611251000">
</head>
<body>
<div class="test-banner" role="note">試験環境(本番のデータには影響しません)</div>

<header class="ctop">
  <a class="brand" href="./">Lazurite 運営ボード</a>
  <div class="top-right">
    <button type="button" id="apps-btn" class="apps-btn" aria-expanded="false" aria-controls="apps-panel" aria-label="アプリ一覧を開く" title="アプリ一覧">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg>
    </button>
    <div id="apps-panel" class="apps-panel" role="dialog" aria-label="アプリ一覧" hidden>
      <div class="apps-h">アプリ一覧</div>
      <div class="apps-grid">
        <a class="app-tile" href="./">
          <span class="app-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
          <span class="app-t">売上ダッシュボード</span>
          <span class="app-s">運営ボードのトップ</span>
        </a>
        <a class="app-tile" href="./#todo">
          <span class="app-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg></span>
          <span class="app-t">予約メモ・Todo</span>
          <span class="app-s">予約ごとのメモと期限付きTodo</span>
        </a>
        <a class="app-tile current" href="cleaning.html" aria-current="page">
          <span class="app-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
          <span class="app-t">清掃スケジュール <em class="badge-proto">試験版</em></span>
          <span class="app-s">いま開いているアプリ</span>
        </a>
        <div class="app-tile soon" aria-disabled="true">
                <span class="app-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg></span>
                <span class="app-t">予約データの取り込み</span>
                <span class="app-s">準備中(Beds24連携)</span>
              </div>
        <div class="app-tile soon" aria-disabled="true">
                <span class="app-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></span>
                <span class="app-t">プライシング検討</span>
                <span class="app-s">準備中</span>
              </div>
        <div class="app-tile soon" aria-disabled="true">
                <span class="app-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4h5M16 8h5M16 12h3"/></svg></span>
                <span class="app-t">宿泊者名簿</span>
                <span class="app-s">準備中</span>
              </div>
        <div class="app-tile soon" aria-disabled="true">
                <span class="app-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg></span>
                <span class="app-t">アンケート分析</span>
                <span class="app-s">準備中</span>
              </div>
      </div>
    </div>
  </div>
</header>

<div class="wrap" id="loading">
  <p class="empty">読み込み中…</p>
</div>

<!-- ログインしていないとき -->
<div class="wrap" id="gate" hidden>
  <div class="card gate">
    <p id="gate-msg">ログインが必要です。運営ボードでログインしてから、もう一度開いてください。</p>
    <p><a class="back" href="./">運営ボードを開く</a></p>
  </div>
</div>

<div class="wrap" id="wrap" hidden>
  <div class="proto" id="proto">
    <span class="seg" role="group" aria-label="画面の切り替え">
      <button type="button" id="v-owner" aria-pressed="true">オーナー画面</button>
      <button type="button" id="v-cleaner" aria-pressed="false">清掃員の画面</button>
    </span>
    <label id="who-wrap" hidden>清掃員:<select id="who"></select></label>
    <span id="save" role="status"></span>
    <span>清掃員本人のログインは次の段階で追加します。今は「清掃員の画面」で、清掃員の代わりに操作して確認できます。</span>
  </div>
  <main id="app"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="js/config.js?v=202611251000"></script>
<script src="js/cleaning.js?v=202611251000"></script>
</body>
</html>
